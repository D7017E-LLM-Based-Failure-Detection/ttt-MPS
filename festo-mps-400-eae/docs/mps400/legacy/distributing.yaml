# MPS 400 knowledge graph: how the NxtStudio solution runs the Distributing station.
# This is the behaviour version 1 must reproduce. Conventions: see ../README.md.
schema: mps400-kg/0.1
updated: "2026-11-10"

sources:
  nxt:
    path: "resources/Solution Archive/MPS_NxtStudio_2_1/IEC61499"
    title: Legacy NxtStudio 2.1 solution (types and System.sys)
  eae-port:
    path: "resources/Solution Archive/MPS_EAE_25_0_1/IEC61499"
    title: Student's EAE port (untested)

legacy_station:
  station: distributing-1
  station_type: distributing
  cat: Distribution2CAT
  instance: Distribution
  device: Distribution (DCSmini)
  status: documented
  sources: [nxt]

interfaces:
  - name: WORKPIECE_REQUEST
    adapter: EVENT_HS
    role: plug
    peer: Testing.Supply
    events_in: {REQ: Testing asks for a workpiece.}
    events_out: {CNF: The workpiece has been handed over.}
    note: "No data. EVENT_HS also declares RSP and IND, which are not used here."

signals:
  note: >-
    Station bits as in ../station-types/distributing.yaml (same bit numbers). The control panel
    is bound separately, see ../component-types/control-console.yaml.
  inputs:
    - {name: CYL_RET, bit: I1, used: true, meaning: Magazine slide retracted (rest position)}
    - {name: CYL_EXT, bit: I2, used: true, meaning: Magazine slide extended (workpiece pushed out)}
    - {name: WP_PICKED, bit: I3, used: false, meaning: Vacuum switch; read but not used by the sequence}
    - {name: ARM_AT_MAG, bit: I4, used: true, meaning: Swivel arm at the magazine}
    - {name: ARM_AT_DOWN, bit: I5, used: true, meaning: Swivel arm at the downstream station}
    - {name: MAG_EMPTY, bit: I6, used: true, meaning: Magazine empty}
  outputs:
    - {name: EXTEND_CYL, bit: O0, meaning: Push a workpiece out of the magazine}
    - {name: VACUUM_ON, bit: O1, meaning: Vacuum on}
    - {name: VACUUM_OFF, bit: O2, meaning: Ejection pulse (release the workpiece)}
    - {name: ARM_TO_MAG, bit: O3, meaning: Swivel arm towards the magazine}
    - {name: ARM_TO_DOWN, bit: O4, meaning: Swivel arm towards the downstream station}

actuator_blocks:
  - {instance: MagazineCyl, type: SingleActingCylinder, kind: basic FB, drives: [EXTEND_CYL], feedback: [CYL_RET, CYL_EXT], commands: [EXTEND, RETRACT]}
  - {instance: Arm, type: CustomStopActuator, kind: basic FB, drives: [ARM_TO_MAG, ARM_TO_DOWN], feedback: [], commands: [EXTEND, RETRACT, STOP], note: "EXTEND = towards the downstream station, RETRACT = towards the magazine, STOP = both outputs off."}
  - {instance: Vacuum, type: CustomStopActuator, kind: basic FB, drives: [VACUUM_ON, VACUUM_OFF], feedback: [], commands: [EXTEND, RETRACT, STOP], note: "EXTEND = vacuum on, RETRACT = ejection pulse, STOP = both outputs off."}

behaviour:
  status: documented
  sources: [nxt]
  panel:
    - "At start-up the RESET lamp is on."
    - "Releasing the RESET button (falling edge) starts the reset sequence; when it is done the RESET lamp goes off and the START lamp comes on."
    - "Pressing START sets the started latch and switches the START lamp off. Pressing STOP clears the latch."
    - "Lamp Q1 is on while the station waits for workpieces because the magazine is empty."
    - "The AUTO/MAN key switch is read but not used."
  reset_sequence:
    block: ArmReset
    steps:
      - Swivel the arm towards the magazine until ARM_AT_MAG, then stop.
      - Swivel the arm towards the downstream station until ARM_AT_MAG goes off, then stop.
    note: >-
      The arm parks just clear of the magazine, between its two end positions. Reason (user,
      2026-11-16): with the arm at the magazine the ejecting cylinder cannot push a workpiece out,
      and with the arm at the Testing side the Testing lift cannot move. Stopping the swivel drive
      between its end positions raises no feedback alarm in the version 1 Actuator2Op (tested
      2026-11-16).
  cycle:
    trigger: WORKPIECE_REQUEST.REQ from Testing, accepted only while the started latch is set.
    block: GiveWorkpiece
    steps:
      - {n: 1, block: MagazineSupplyWp, do: "If MAG_EMPTY, signal WAITING (lamp Q1) and wait until the magazine is filled."}
      - {n: 2, block: MagazineSupplyWp, do: "EXTEND_CYL on until CYL_EXT, then off until CYL_RET."}
      - {n: 3, block: ToMagazine (SimpleMove), do: "Arm towards the magazine until ARM_AT_MAG, then stop."}
      - {n: 4, block: Grab (VacuumSequence), do: "VACUUM_ON for 500 ms, then both vacuum outputs off."}
      - {n: 5, block: ToClient (SimpleMove), do: "Arm towards the downstream station until ARM_AT_DOWN, then stop."}
      - {n: 6, block: Release (VacuumSequence), do: "VACUUM_OFF (ejection pulse) for 500 ms, then both vacuum outputs off."}
      - {n: 7, block: ArmReset, do: "Park the arm as in the reset sequence."}
      - {n: 8, do: "Send WORKPIECE_REQUEST.CNF to Testing; lamp Q1 off."}
  timers:
    - {what: Vacuum on pulse, value: 500 ms}
    - {what: Ejection pulse, value: 500 ms}

observations:
  - "A request that arrives while the station is not started is dropped, not queued."
  - "STOP only clears the started latch; it does not abort a running cycle."
  - "The vacuum switch (WP_PICKED) is not checked, so a failed pick is not detected."
  - "No timeouts on movements: a missing end-position signal stalls the cycle silently."
  - "Compared with Festo's reference sequence: the 1-bit optical link (downstream station free) is replaced by the request/confirm adapter, and there is no manual/automatic distinction."

port_deviations:
  status: documented
  sources: [eae-port]
  items:
    - "The port binds the six station inputs to module channels DI00-DI05. The legacy solution and Festo's drawing have them on bits 1-6. With the project's wiring rule (station bit n on channel n) the port's binding is off by one."
    - "The port uses a second module pair for the control panel; the wiring rule puts the panel on channels 8-15 of the same pair."
    - "The port spells the output VACCUM_OFF."
