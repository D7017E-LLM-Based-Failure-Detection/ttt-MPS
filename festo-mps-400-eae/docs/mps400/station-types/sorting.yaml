sequence:
  id: sorting-reference
  standard: GRAFCET to DIN EN 60848
  status: documented
  sources: ["cd-09-grafcet#3-4"]
  note: >-
    Festo's sequence sorts red onto slide 1, silver onto slide 2 and black to the end of the
    belt (slide 3). The lab behaviour follows the NxtStudio solution (see
    ../legacy/sorting.yaml). "stored: true" marks actions drawn with the stored-action arrow.
  steps:
    - {id: S1, initial: true, name: Start}
    - {id: S2, name: Reset indicator light, actions: [{do: Turn on the "reset" indicator light, stored: false}]}
    - {id: S3, name: Initial position, actions: [{do: Move the station to its initial position, stored: true}]}
    - {id: S4, name: Reset OK, actions: [{do: Set flag "reset finished", stored: true}]}
    - {id: S5, name: Cycle start (empty step)}
    - {id: S6, name: Start indicator light, actions: [{do: Turn on the "start" indicator light, stored: false}]}
    - {id: S7, name: Slide full indicator light, actions: [{do: Turn off the "slide full" indicator light, stored: true}]}
    - {id: S8, name: Station not occupied, actions: [{do: Signal "station not occupied", stored: true}]}
    - id: S9
      name: Conveyor belt motor
      actions:
        - {do: Signal "station occupied", stored: true}
        - {do: Turn on the conveyor belt motor, stored: true}
    - {id: S10, name: Workpiece sensing (empty step)}
    - {id: S11, name: Finish transportation (empty step)}
    - id: S12
      name: Slide full
      actions:
        - {do: Signal "station occupied", stored: true}
        - {do: Turn on the "slide full" indicator light, stored: true}
        - {do: Turn on the "start" indicator light, stored: true}
    - {id: S13, name: Sorting (empty step)}
    - {id: S14, name: Extend separator 1, actions: [{do: Extend separator 1, stored: true}]}
    - {id: S15, name: Retract stopper, actions: [{do: Retract stopper, stored: true}]}
    - {id: S16, name: Extend separator 2, actions: [{do: Extend separator 2, stored: true}]}
    - {id: S17, name: Retract stopper, actions: [{do: Retract stopper, stored: true}]}
    - {id: S18, name: Retract stopper, actions: [{do: Retract stopper, stored: true}]}
    - id: S19
      name: Cycle end
      actions:
        - {do: Set flag "cycle end", stored: false}
        - {do: Move the station to its initial position, stored: true}
  transitions:
    - {from: S1, to: S5, condition: Station is reset and in initial position}
    - {from: S1, to: S2, condition: Station is not reset}
    - {from: S2, to: S3, condition: Reset button pressed}
    - {from: S3, to: S4, condition: Station in initial position}
    - {from: S4, to: S5, condition: Flag "reset finished" is set}
    - {from: S5, to: S6, condition: Flag "start" is not set}
    - {from: S5, to: S7, condition: Flag "start" is set}
    - {from: S6, to: S7, condition: Flag "start" is set}
    - {from: S7, to: S8, condition: Slide is not full}
    - {from: S7, to: S11, condition: Slide is full}
    - {from: S8, to: S9, condition: Workpiece available}
    - {from: S9, to: S10, condition: 3 s in step 9 and workpiece not available}
    - {from: S10, to: S13, condition: 2 s in step 10}
    - {from: S11, to: S12, condition: 1 s in step 11 and slide still full}
    - {from: S11, to: S7, condition: 1 s in step 11 and slide not full}
    - {from: S12, to: S7, condition: Error acknowledged}
    - {from: S13, to: S14, condition: Workpiece is red}
    - {from: S13, to: S16, condition: Workpiece is silver}
    - {from: S13, to: S18, condition: Workpiece is black}
    - {from: S14, to: S15, condition: Separator 1 extended}
    - {from: S16, to: S17, condition: Separator 2 extended}
    - {from: "S15, S17, S18", to: S19, condition: Workpiece has reached slide}
    - {from: S19, to: S5, condition: Station in initial position}
