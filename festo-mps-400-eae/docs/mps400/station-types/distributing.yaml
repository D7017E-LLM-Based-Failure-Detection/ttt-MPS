station_type:
  id: distributing
  name: Distributing station
  name_de: Station Verteilen
  doc_series: MPS-C
  status: documented
  sources: [cd-01-el, cd-01-pn, cd-01-grafcet, cd-01-parts]
  function: >-
    Pushes a workpiece out of the stack magazine with the ejecting cylinder, picks it up with a
    vacuum suction cup on a swivel arm, and swivels it over to the downstream station.
  function_status: inferred

io_terminal:
  id: XA2
  part: "034035 I/O terminal (MP-B-AN-E/A-T)"
  syslink_station: XMA2
  syslink_console: XMG1
  inputs: 8
  outputs: 8
  supply:
    inputs: {plus: "24VB on XMA2 pins 21-22", minus: "0VB on XMA2 pins 23-24"}
    outputs: {plus: "24VA on XMA2 pins 9-10", minus: "0VA on XMA2 pins 11-12"}
  status: documented
  sources: ["cd-01-el#3-5", cd-01-parts]

valve_terminal:
  id: "0V1"
  kind: CPV valve terminal
  part: "196972 CP valve terminal, distributing (MP3-M-VCP)"
  positions:
    - {code: "M", valve: "1V1", coils: ["1M1"]}
    - {code: "E", valve: "2V1", coils: ["2M1", "2M2"]}
    - {code: "N", valve: "3V1", coils: ["3M1", "3M2"]}
  status: documented
  sources: [cd-01-pn, "cd-01-el#3", cd-01-parts]
  verify: >-
    The valve function at each position (single or double solenoid, 3/2 or 5/2) has not been
    read yet; see data sheets 161414 (CPV ..52) and 161417 (CPV ..32O) and the vacuum
    generator 185865 (CPV-VI70).

devices:
  - id: "1A1"
    kind: pneumatic cylinder
    name: Ejecting cylinder
    name_de: Ausschiebezylinder
    valve: "1V1"
    coils: ["1M1"]
    sensors: ["1B1", "1B2"]
    flow_controls: ["1V2", "1V3"]
    data_sheet: {ref: "019181 Pneumatic cylinder DSNU-8-80", status: inferred}
    status: documented
    sources: [cd-01-pn, "cd-01-el#4-5"]
    note: >-
      Pushes the workpiece out of the stack magazine. The sequence calls this "extend magazine
      slide (retract ejecting cylinder)", and the output description calls it "push out
      workpiece".
  - id: "2A1"
    kind: vacuum suction cup
    name: Vacuum suction cup on the swivel arm
    name_de: Vakuum Greifer
    valve: "2V1"
    coils: ["2M1", "2M2"]
    sensors: ["2B1"]
    other_components: ["2V2", "2V3", "2Z1"]
    data_sheet: {ref: "036135 Suction cup VAS-8-M5-PUR", status: inferred}
    status: documented
    sources: [cd-01-pn, "cd-01-el#4-5"]
    note: 2M1 switches the vacuum on; 2M2 gives an ejection (blow-off) pulse.
  - id: "3A1"
    kind: swivel drive
    name: Swivel drive of the swivel arm
    name_de: Schwenkzylinder
    valve: "3V1"
    coils: ["3M1", "3M2"]
    sensors: ["3B1", "3B2"]
    flow_controls: ["3V2", "3V3"]
    data_sheet: {ref: "011910 Rotary drive DSR-16-180", status: inferred}
    status: documented
    sources: [cd-01-pn, "cd-01-el#4-5"]
    note: >-
      Two positions, "magazine" and "downstream station". The pneumatic diagram names the
      end-position sensors -3S1 and -3S2; the electrical diagram names them 3B1 and 3B2 and
      draws them as micro switches.
  - id: "B4"
    kind: light barrier
    name: Magazine empty sensor
    name_de: Magazin leer
    part: {ref: "526205 Light barrier (MP3-M-LS-SM)", status: inferred}
    status: documented
    sources: ["cd-01-el#4", cd-01-parts]
  - id: "IP_FI"
    kind: optical receiver
    name: Downstream station free, receiver of the 1-bit link to the next station
    name_de: Folgestation frei
    part: {ref: "196964 SensLink receiver (MP3-M-SLE)", status: inferred}
    status: documented
    sources: ["cd-01-el#4", "cd-01-grafcet#3", cd-01-parts]

signals:
  status: documented
  sources: ["cd-01-el#4-5", nxt]
  note: >-
    legacy = the signal name in the NxtStudio solution, which binds the same bit numbers
    (DIN1-DIN6, DO0-DO4) and so confirms that the sensors sit on I1-I7 and I0 is empty.
    The legacy names of I1 and I2 describe the magazine slide, Festo's describe the ejecting
    cylinder: the slide is retracted when the cylinder is extended (see the sequence, steps
    S11 and S13). Bits without a legacy name are not used there.
  inputs:
    - {address: I0, pin: 13, symbol: null, meaning: Not connected, legacy: null}
    - {address: I1, pin: 14, symbol: "1B2", device: "1A1", sensor: proximity sensor, meaning: Ejecting cylinder extended, meaning_de: Ausschiebezylinder ausgefahren, legacy: CYL_RET}
    - {address: I2, pin: 15, symbol: "1B1", device: "1A1", sensor: proximity sensor, meaning: Ejecting cylinder retracted, meaning_de: Ausschiebezylinder eingefahren, legacy: CYL_EXT}
    - {address: I3, pin: 16, symbol: "2B1", device: "2A1", sensor: vacuum switch, meaning: Workpiece gripped, meaning_de: Werkstück angesaugt, legacy: WP_PICKED}
    - {address: I4, pin: 17, symbol: "3B1", device: "3A1", sensor: micro switch, meaning: Swivel drive in magazine position, meaning_de: Schwenkzylinder in Position Magazin, legacy: ARM_AT_MAG}
    - {address: I5, pin: 18, symbol: "3B2", device: "3A1", sensor: micro switch, meaning: Swivel drive in downstream station position, meaning_de: Schwenkzylinder in Position Folgestation, legacy: ARM_AT_DOWN}
    - {address: I6, pin: 19, symbol: "B4", device: "B4", sensor: light barrier, meaning: Magazine empty, meaning_de: Magazin leer, legacy: MAG_EMPTY}
    - {address: I7, pin: 20, symbol: "IP_FI", device: "IP_FI", sensor: optical receiver, meaning: Downstream station free, meaning_de: Folgestation frei, legacy: null}
  outputs:
    - {address: O0, pin: 1, symbol: "1M1", device: "1A1", meaning: "Ejecting cylinder: push out workpiece", meaning_de: Ausschiebezylinder Werkstück ausschieben, legacy: EXTEND_CYL}
    - {address: O1, pin: 2, symbol: "2M1", device: "2A1", meaning: Vacuum on, meaning_de: Vakuum ein, legacy: VACUUM_ON}
    - {address: O2, pin: 3, symbol: "2M2", device: "2A1", meaning: Ejection pulse on, meaning_de: Abwurfimpuls ein, legacy: VACUUM_OFF}
    - {address: O3, pin: 4, symbol: "3M1", device: "3A1", meaning: Swivel drive to magazine, meaning_de: Schwenkzylinder zu Magazin, legacy: ARM_TO_MAG}
    - {address: O4, pin: 5, symbol: "3M2", device: "3A1", meaning: Swivel drive to downstream station, meaning_de: Schwenkzylinder zu Folgestation, legacy: ARM_TO_DOWN}
    - {address: O5, pin: 6, symbol: null, meaning: Not used}
    - {address: O6, pin: 7, symbol: null, meaning: Not used}
    - {address: O7, pin: 8, symbol: null, meaning: Not used}

operator_panel:
  syslink: XMG1
  component_type: control-console
  status: documented
  sources: ["cd-01-el#3", "cd-01-grafcet#3-4"]
  note: >-
    The sequence uses the reset button, a start flag, manual and automatic mode, error
    acknowledgement and indicator lights (reset, start, magazine empty). These come from the
    station's control console through XMG1 (component-types/control-console.yaml). In the lab
    every station has one; see station_operation in plant.yaml.

