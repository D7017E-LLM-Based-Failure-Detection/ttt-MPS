sequence:
  id: distributing-reference
  standard: GRAFCET to DIN EN 60848
  status: documented
  sources: ["cd-01-grafcet#3-4"]
  note: >-
    Festo's reference sequence for a stand-alone station with a 1-bit link to the downstream
    station. The lab's sequence may differ, because the workpiece goes onto a tray at
    interface 1. "stored: true" marks actions drawn with the stored-action arrow; "stored:
    false" marks plain (continuous) actions.
  steps:
    - {id: S1, initial: true, name: Start}
    - id: S2
      name: Reset indicator light
      actions: [{do: Turn on the "reset" indicator light, stored: false}]
    - id: S3
      name: Initial position
      actions: [{do: Move the station to its initial position, stored: true}]
    - id: S4
      name: Reset OK
      actions: [{do: Set flag "reset finished", stored: true}]
    - {id: S5, name: Cycle start (empty step)}
    - id: S6
      name: Start indicator light
      actions: [{do: Turn on the "start" indicator light, stored: false}]
    - {id: S7, name: Downstream station free (empty step)}
    - id: S8
      name: Swivel arm to downstream station
      actions: [{do: Swivel arm to position "downstream station", stored: true}]
    - {id: S9, name: Magazine status (empty step)}
    - id: S10
      name: Magazine indicator light
      actions:
        - {do: Turn on the "magazine empty" indicator light, stored: false}
        - {do: Turn on the "start" indicator light, stored: false}
    - id: S11
      name: Eject workpiece
      actions: [{do: Extend magazine slide (retract ejecting cylinder), stored: true}]
    - id: S12
      name: Swivel arm to magazine
      actions: [{do: Move swivel arm to position "magazine", stored: true}]
    - id: S13
      name: Workpiece picked up
      actions:
        - {do: Turn on vacuum, stored: true}
        - {do: Retract magazine slide (extend ejecting cylinder), stored: true}
    - id: S14
      name: Swivel arm to downstream station
      actions: [{do: Move swivel arm to position "downstream station", stored: true}]
    - id: S15
      name: Drop off workpiece
      actions: [{do: Turn off vacuum, stored: true}]
    - id: S16
      name: Cycle end
      actions:
        - {do: Set flag "cycle end", stored: null}
        - {do: Swivel arm to position "magazine", stored: true}
      verify: Whether "set flag cycle end" is drawn as a stored action is unclear in the source.
  transitions:
    - {from: S1, to: S5, condition: Station is reset and in initial position}
    - {from: S1, to: S2, condition: Station is not reset}
    - {from: S2, to: S3, condition: The "reset" button is pressed}
    - {from: S3, to: S4, condition: Station in initial position}
    - {from: S4, to: S5, condition: Flag "reset finished" is set}
    - {from: S5, to: S6, condition: Flag "start" is not set}
    - {from: S5, to: S7, condition: Flag "start" is set}
    - {from: S6, to: S7, condition: Flag "start" is set}
    - {from: S7, to: S8, condition: Downstream station free}
    - {from: S8, to: S9, condition: Swivel arm in position "downstream station"}
    - {from: S9, to: S11, condition: Workpiece in magazine and swivel arm in position "downstream station"}
    - {from: S9, to: S10, condition: No workpiece in magazine and swivel arm in position "downstream station"}
    - {from: S10, to: S11, condition: Workpiece in magazine and error acknowledged}
    - {from: S11, to: S12, condition: Workpiece ejected}
    - {from: S12, to: S13, condition: Swivel arm in position "magazine" and downstream station free}
    - {from: S13, to: S14, condition: Workpiece picked up and magazine slide retracted and downstream station free}
    - {from: S14, to: S15, condition: Swivel arm in position "downstream station"}
    - {from: S15, to: S16, condition: No workpiece picked up and manual mode}
    - {from: S15, to: S9, condition: No workpiece picked up and automatic mode}
    - {from: S16, to: S5, condition: Swivel arm in position "magazine"}
