station_type:
  id: testing
  name: Testing station
  name_de: Station Prüfen
  doc_series: MPS-C
  status: documented
  sources: [cd-02-el, cd-02-pn, cd-02-grafcet, cd-02-parts]
  function: >-
    Detects a workpiece and whether it is black, lifts it to the measuring module, checks its
    height, and either passes it on down the air slide to the next station or ejects it at the
    bottom.
  function_status: inferred

io_terminal:
  id: XA2
  part: "034035 I/O terminal (MP-B-AN-E/A-T)"
  syslink_station: XMA2
  syslink_console: XMG1
  syslink_analog: XMA3
  inputs: 8
  outputs: 8
  supply:
    inputs: {plus: "24VB on XMA2 pins 21-22", minus: "0VB on XMA2 pins 23-24"}
    outputs: {plus: "24VA on XMA2 pins 9-10", minus: "0VA on XMA2 pins 11-12"}
  status: documented
  sources: ["cd-02-el#3-6", cd-02-parts]

valve_terminal:
  id: "0V1"
  kind: CPV valve terminal
  part: "526227 CP valve terminal, testing (MP3-M-MCM)"
  positions:
    - {code: "C", valve: "1V1", coils: ["1M1", "1M2"]}
    - {code: "M", valve: "2V1", coils: ["2M1"]}
    - {code: "M", valve: "3V1", coils: ["3M1"]}
  status: documented
  sources: [cd-02-pn, "cd-02-el#3", "cd-02-el#5", cd-02-parts]
  verify: >-
    The valve function at each position has not been read from the data sheets (161414 CPV ..52,
    161416 CPV ..32G).

devices:
  - id: "1A1"
    kind: pneumatic linear drive
    name: Lifting cylinder
    name_de: Hebezylinder
    valve: "1V1"
    coils: ["1M1", "1M2"]
    sensors: ["1B1", "1B2"]
    flow_controls: ["1V2", "1V3"]
    other_components: ["1V4", "1V5"]
    data_sheet: {ref: "015221 Pneumatic linear drive DGO-12", status: inferred}
    status: documented
    sources: [cd-02-pn, "cd-02-el#4-5"]
    note: "Two coils: 1M1 lowers, 1M2 raises. 1B1 = raised, 1B2 = lowered."
  - id: "2A1"
    kind: pneumatic cylinder
    name: Ejecting cylinder
    name_de: Auswerfzylinder
    valve: "2V1"
    coils: ["2M1"]
    sensors: ["2B1"]
    flow_controls: ["2V2"]
    data_sheet: {ref: "156041 / 156508 Pneumatic cylinder ADVU-16", status: inferred}
    status: documented
    sources: [cd-02-pn, "cd-02-el#4-5"]
    note: One coil (extend) and one sensor (retracted). There is no extended sensor.
  - id: "3A1"
    kind: air slide
    name: Air slide (air cushion slide)
    name_de: Luftkissenrutsche
    valve: "3V1"
    coils: ["3M1"]
    sensors: []
    flow_controls: ["3V2"]
    part: {ref: "656859 Air slide module (MP3-M-LRT-B)", status: inferred}
    status: documented
    sources: [cd-02-pn, "cd-02-el#5"]
    note: One coil, no feedback.
  - id: "PART_AV"
    kind: proximity sensor
    name: Workpiece available
    name_de: Werkstück vorhanden
    data_sheet: {ref: "258172 Proximity sensor, capacitive", status: inferred}
    status: documented
    sources: ["cd-02-el#4"]
  - id: "B2"
    kind: optical sensor
    name: Workpiece is not black
    name_de: Werkstück nicht schwarz
    data_sheet: {ref: "165342 Diffuse sensor SOEG-RT", status: inferred}
    status: documented
    sources: ["cd-02-el#4"]
  - id: "B4"
    kind: light barrier
    name: Safety light barrier
    name_de: Sicherheitslichtschranke
    data_sheet: {ref: "165331 Retro-reflective sensor SOEG-RSP", status: inferred}
    status: documented
    sources: ["cd-02-el#4"]
  - id: "COMP"
    kind: comparator with analog height sensor
    name: Workpiece height correct
    name_de: Komparator Werkstückhöhe korrekt
    data_sheet: {ref: "526214 Comparator; 326498 Displacement encoder", status: inferred}
    status: documented
    sources: ["cd-02-el#4", "cd-02-el#6"]
    note: >-
      The electrical drawing calls the comparator 3A1, the same code the pneumatic drawing uses
      for the air slide; this file uses the id COMP for it. The analog height sensor R1 feeds
      the comparator, whose OK output is input I3. The analog value is also available on the
      analog SysLink XMA3 (UE1 on pin 8, AGNDE on pin 6); the lab PLCs have no analog module.
  - id: "IP_FI"
    kind: optical receiver
    name: Downstream station free, receiver of the 1-bit link
    name_de: Folgestation frei
    part: {ref: "196964 SensLink receiver (MP3-M-SLE)", status: inferred}
    status: documented
    sources: ["cd-02-el#4", cd-02-parts]
  - id: "IP_N_FO"
    kind: optical transmitter
    name: Station occupied, transmitter of the 1-bit link to the upstream station
    name_de: Station belegt
    part: {ref: "196963 SensLink transmitter (MP3-M-SLS)", status: inferred}
    status: documented
    sources: ["cd-02-el#5", cd-02-parts]

signals:
  status: documented
  sources: ["cd-02-el#4-5", nxt]
  note: >-
    legacy = the signal name in the NxtStudio solution, which binds the same bit numbers
    (DIN0-DIN6, DO0-DO3). Bits without a legacy name are not used there.
  inputs:
    - {address: I0, pin: 13, symbol: "PART_AV", device: "PART_AV", meaning: Workpiece available, meaning_de: Werkstück vorhanden, legacy: WP_AVA}
    - {address: I1, pin: 14, symbol: "B2", device: "B2", meaning: Workpiece is not black, meaning_de: Werkstück nicht schwarz, legacy: WP_NOT_BLK}
    - {address: I2, pin: 15, symbol: "B4", device: "B4", meaning: Safety light barrier, meaning_de: Sicherheitslichtschranke, legacy: LIGHT_CURTAIN}
    - {address: I3, pin: 16, symbol: "COMP", device: "COMP", meaning: Workpiece height correct, meaning_de: Werkstückhöhe korrekt, legacy: HEIGHT_OK}
    - {address: I4, pin: 17, symbol: "1B1", device: "1A1", meaning: Lifting cylinder raised, meaning_de: Hebezylinder oben, legacy: LIFT_AT_TOP}
    - {address: I5, pin: 18, symbol: "1B2", device: "1A1", meaning: Lifting cylinder lowered, meaning_de: Hebezylinder unten, legacy: LIFT_AT_BOTTOM}
    - {address: I6, pin: 19, symbol: "2B1", device: "2A1", meaning: Ejecting cylinder retracted, meaning_de: Auswerfzylinder eingefahren, legacy: EJECTOR_RET}
    - {address: I7, pin: 20, symbol: "IP_FI", device: "IP_FI", meaning: Downstream station free, meaning_de: Folgestation frei, legacy: null}
  outputs:
    - {address: O0, pin: 1, symbol: "1M1", device: "1A1", meaning: Lower lifting cylinder, meaning_de: Hebezylinder nach unten, legacy: LOWER_LIFT}
    - {address: O1, pin: 2, symbol: "1M2", device: "1A1", meaning: Raise lifting cylinder, meaning_de: Hebezylinder nach oben, legacy: RAISE_LIFT}
    - {address: O2, pin: 3, symbol: "2M1", device: "2A1", meaning: Extend ejecting cylinder, meaning_de: Auswerfzylinder ausfahren, legacy: EXTEND_EJECTOR}
    - {address: O3, pin: 4, symbol: "3M1", device: "3A1", meaning: Air slide on, meaning_de: Luftkissenrutsche ein, legacy: AIR_SLIDE}
    - {address: O4, pin: 5, symbol: null, meaning: Not used}
    - {address: O5, pin: 6, symbol: null, meaning: Not used}
    - {address: O6, pin: 7, symbol: null, meaning: Not used}
    - {address: O7, pin: 8, symbol: "IP_N_FO", device: "IP_N_FO", meaning: Station occupied, meaning_de: Station belegt, legacy: null}

operator_panel:
  syslink: XMG1
  component_type: control-console
  status: documented
  sources: ["cd-02-el#3", "cd-02-grafcet#3-4"]
  note: >-
    The sequence uses the reset button, a start flag and indicator lights (reset, start and a
    "material" light). These come from the station's control console
