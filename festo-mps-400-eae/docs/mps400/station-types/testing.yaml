    date: "2006-04-05"
  cd-02-pn:
    path: "resources/MPS documentation CD/02_Testing/Circuit diagrams/Pneumatic_Circuit_Diagram_Testing.pdf"
    title: "Pneumatic circuit diagram, MPS-C Testing station"
    date: "2005-04-11"
  cd-02-grafcet:
