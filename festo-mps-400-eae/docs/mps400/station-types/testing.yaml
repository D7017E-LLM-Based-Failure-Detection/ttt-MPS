sequence:
  id: testing-reference
  standard: GRAFCET to DIN EN 60848
  status: documented
  sources: ["cd-02-grafcet#3-4"]
  note: >-
    Festo's reference sequence for a stand-alone station with a 1-bit link. The lab behaviour
    follows the NxtStudio solution instead (see ../legacy/testing.yaml), which differs: it
    rejects black workpieces and has no "material" light. "stored: true" marks actions drawn
    with the stored-action arrow.
  steps:
    - {id: S1, initial: true, name: Start}
    - id: S2
      name: Reset indicator light
      actions: [{do: Turn on the "reset" indicator light, stored: false}]
    - id: S3
      name: Initial position
      actions: [{do: Move the station to its initial position, stored: true}]
    - id: S4
      name: Eject workpiece
      actions: [{do: Eject workpiece, stored: false}]
    - id: S5
      name: Reset OK
      actions: [{do: Set flag "reset finished", stored: true}]
    - {id: S6, name: Cycle start (empty step)}
    - id: S7
      name: Start indicator light
      actions: [{do: Turn on the "start" indicator light, stored: false}]
    - id: S8
      name: Station not occupied
      actions: [{do: Signal "station not occupied", stored: true}]
    - id: S9
      name: Material indicator light on
      actions:
        - {do: Turn on the "material" indicator light, stored: true}
        - {do: Signal "station occupied", stored: true}
    - id: S10
      name: Material indicator light off
      actions:
        - {do: Turn off the "material" indicator light, stored: true}
        - {do: Signal "station occupied", stored: true}
    - id: S11
      name: Raise lifting cylinder
      actions: [{do: Raise lifting cylinder, stored: true}]
    - {id: S12, name: Measure height (empty step)}
    - id: S13
      name: Eject workpiece
      actions:
        - {do: Eject workpiece, stored: false}
        - {do: Turn on air slide, stored: false}
    - id: S14
      name: Air slide on
      actions: [{do: Turn on air slide, stored: false}]
    - id: S15
      name: Lower lifting cylinder
      actions: [{do: Lower lifting cylinder, stored: true}]
    - id: S16
      name: Lower lifting cylinder (invalid height)
      actions: [{do: Lower lifting cylinder, stored: true}]
    - id: S17
      name: Eject workpiece (invalid height)
      actions: [{do: Eject workpiece, stored: false}]
    - id: S18
      name: Cycle end
      actions: [{do: Set flag "cycle end", stored: false}]
  transitions:
    - {from: S1, to: S6, condition: Station is reset and in initial position}
    - {from: S1, to: S2, condition: Station is not reset}
    - {from: S2, to: S3, condition: Reset button pressed and safety light barrier unbroken}
    - {from: S3, to: S4, condition: Station in initial position}
    - {from: S4, to: S5, condition: Workpiece ejected}
    - {from: S5, to: S6, condition: Flag "reset finished" is set}
    - {from: S6, to: S7, condition: Flag "start" is not set}
    - {from: S6, to: S8, condition: Flag "start" is set}
    - {from: S7, to: S8, condition: Flag "start" is set}
    - {from: S8, to: S9, condition: Workpiece available and black}
    - {from: S8, to: S10, condition: Workpiece available and not black}
    - {from: S9, to: S11, condition: 3 s in step 9 and workpiece black}
    - {from: S10, to: S11, condition: 3 s in step 10 and workpiece not black}
    - {from: S11, to: S12, condition: Lifting cylinder raised}
    - {from: S12, to: S13, condition: 2 s in step 12 and height ok and downstream station free}
    - {from: S12, to: S16, condition: 2 s in step 12 and invalid height}
    - {from: S13, to: S14, condition: Workpiece ejected}
    - {from: S14, to: S15, condition: 3 s in step 14 or downstream station occupied}
    - {from: S15, to: S18, condition: Lifting cylinder lowered}
    - {from: S16, to: S17, condition: Lifting cylinder lowered}
    - {from: S17, to: S18, condition: Workpiece ejected}
    - {from: S18, to: S6, condition: Flag "cycle end" is set}
