# MPS 400 knowledge graph: Festo station type "Handling" (pneumatic PicAlfa).
# The lab has two of these: handling-1 at interface 2 and handling-2 at interface 6.
# Conventions (status values, sources, ids): see ../README.md.
schema: mps400-kg/0.1
updated: "2026-11-10"

