sequence:
  id: handling-reference
  standard: GRAFCET to DIN EN 60848
  status: documented
  sources: ["cd-04-grafcet#3-4"]
  note: >-
    Festo's stand-alone sequence: pick at the upstream station, sort black workpieces onto the
    slide at the middle position, pass the rest to the downstream station. The lab behaviour
    follows the NxtStudio solution (see ../legacy/handling.yaml). "stored: true" marks actions
    drawn with the stored-action arrow.
  steps:
    - {id: S1, initial: true, name: Start}
    - {id: S2, name: Reset indicator light, actions: [{do: Turn on the "reset" indicator light, stored: false}]}
    - {id: S3, name: Initial position, actions: [{do: Move the station to its initial position, stored: true}]}
    - {id: S4, name: Reset OK, actions: [{do: Set flag "reset finished", stored: true}]}
    - {id: S5, name: Cycle start (empty step)}
    - {id: S6, name: Start indicator light, actions: [{do: Turn on the "start" indicator light, stored: false}]}
    - {id: S7, name: Station not occupied, actions: [{do: Signal "station not occupied", stored: true}]}
    - {id: S8, name: Station occupied, actions: [{do: Signal "station occupied", stored: true}]}
    - id: S9
      name: Pick up workpiece
      actions:
        - {do: Open gripper, stored: true}
        - {do: Extend gripper, stored: true}
    - {id: S10, name: Close gripper, actions: [{do: Close gripper, stored: true}]}
    - {id: S11, name: Retract gripper, actions: [{do: Retract gripper, stored: true}]}
    - {id: S12, name: Workpiece black, actions: [{do: Move the linear drive to position "slide black", stored: false}]}
    - {id: S13, name: Workpiece red or silver, actions: [{do: Move the linear drive to position "slide red/silver" or "downstream station", stored: false}]}
    - {id: S14, name: Wait until downstream station is free (empty step)}
    - {id: S15, name: Extend gripper, actions: [{do: Extend gripper, stored: true}]}
    - {id: S16, name: Open gripper, actions: [{do: Open gripper, stored: true}]}
    - {id: S17, name: Retract gripper, actions: [{do: Retract gripper, stored: true}]}
    - id: S18
      name: Cycle end
      actions:
        - {do: Move the linear drive to position "upstream station", stored: true}
        - {do: Set flag "cycle end", stored: false}
  transitions:
    - {from: S1, to: S5, condition: Station is reset and in initial position}
    - {from: S1, to: S2, condition: Station is not reset}
    - {from: S2, to: S3, condition: Reset button pressed}
    - {from: S3, to: S4, condition: Station in initial position}
    - {from: S4, to: S5, condition: Flag "reset finished" is set}
    - {from: S5, to: S6, condition: Flag "start" is not set}
    - {from: S5, to: S7, condition: Flag "start" is set}
    - {from: S6, to: S7, condition: Flag "start" is set}
    - {from: S7, to: S8, condition: Workpiece available}
    - {from: S8, to: S9, condition: 3 s in step 8}
    - {from: S9, to: S10, condition: Gripper opened and extended}
    - {from: S10, to: S11, condition: Gripper closed}
    - {from: S11, to: S12, condition: Gripper retracted and workpiece is black}
    - {from: S11, to: S13, condition: Gripper retracted and workpiece is not black}
    - {from: S12, to: S14, condition: Linear drive at position "slide black"}
    - {from: S13, to: S14, condition: Linear drive at position "slide red/silver" or "downstream station"}
    - {from: S14, to: S15, condition: Downstream station is free}
    - {from: S15, to: S16, condition: Gripper extended}
    - {from: S16, to: S17, condition: Gripper opened}
    - {from: S17, to: S18, condition: Gripper retracted}
    - {from: S18, to: S5, condition: Linear drive at position "upstream station"}
