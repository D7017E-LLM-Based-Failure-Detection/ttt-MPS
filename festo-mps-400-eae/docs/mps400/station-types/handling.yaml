    path: "resources/MPS documentation CD/04_Handling/Circuit diagrams/Electric_Circuit_Diagram_Handling.pdf"
    title: "Circuit diagrams, MPS-C Handling station (drawing 195783 el.)"
    date: "2006-04-05"
  cd-04-pn:
    path: "resources/MPS documentation CD/04_Handling/Circuit diagrams/Pneumatic_Circuit_Diagram_Handling.pdf"
    title: "Pneumatic circuit diagram, Handling station (PickAlfa)"
    date: "2006-04-06"
