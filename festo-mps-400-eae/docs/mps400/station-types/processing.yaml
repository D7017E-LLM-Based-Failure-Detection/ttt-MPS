sequence:
  id: processing-reference
  standard: GRAFCET to DIN EN 60848
  status: documented
  sources: ["cd-03-grafcet#3-7"]
  note: >-
    Festo's sequence works on up to three workpieces at once: after each table step, checking
    (macro step M20), drilling (M30) and output (M40) run in parallel, and the check result
    ("workpiece orientation", 1 = not ok) is shifted along a bit register with the table. The
    lab behaviour follows the NxtStudio solution, which handles one workpiece at a time (see
    ../legacy/processing.yaml). M20, M30 and M40 each end at once when the start flag is not
    set or there is nothing to do.
  steps:
    - {id: S1, initial: true, name: Start}
    - {id: S2, name: Reset indicator light, actions: [{do: Turn on the "reset" indicator light, stored: false}]}
    - {id: S3, name: Initial position, actions: [{do: Move the station to its initial position, stored: true}]}
    - {id: S4, name: Turn rotary indexing table, actions: [{do: Turn the table to its initial position, stored: false}]}
    - {id: S5, name: Reset OK, actions: [{do: Set flag "reset finished", stored: true}]}
    - {id: S6, name: Cycle start (empty step)}
    - {id: S7, name: Start indicator light, actions: [{do: Turn on the "start" indicator light, stored: false}]}
    - {id: S8, name: Station not occupied, actions: [{do: Signal "station not occupied", stored: true}]}
    - {id: S9, name: Station occupied, actions: [{do: Signal "station occupied", stored: true}]}
    - {id: S10, name: Wait until downstream station is free (empty step)}
    - {id: S11, name: Rotary indexing table, actions: [{do: Turn on the rotary indexing table, stored: false}]}
    - {id: S12, name: Program synchronisation (empty step)}
    - {id: S13, name: Delay (empty step)}
    - {id: M20, name: "Macro step: drill hole checking (parallel)"}
    - {id: S21, name: Checking workpiece orientation, actions: [{do: Turn on verifying magnet, stored: true}]}
    - id: S22
      name: Workpiece orientation ok
      actions:
        - {do: Turn off verifying magnet, stored: true}
        - {do: Reset bit 1 of "workpiece orientation", stored: true}
    - id: S23
      name: Workpiece orientation not ok
      actions:
        - {do: Turn off verifying magnet, stored: true}
        - {do: Set bit 1 of "workpiece orientation", stored: true}
    - {id: M30, name: "Macro step: drilling (parallel)"}
    - {id: S31, name: Fixate workpiece, actions: [{do: Fixate workpiece, stored: true}]}
    - id: S32
      name: Drill on
      actions:
        - {do: Lower drilling unit, stored: true}
        - {do: Turn on drill, stored: true}
    - id: S33
      name: Drill off
      actions:
        - {do: Raise drilling unit, stored: true}
        - {do: Turn off drill, stored: true}
    - {id: S34, name: Free workpiece, actions: [{do: Unfix workpiece, stored: true}]}
    - {id: M40, name: "Macro step: workpiece output (parallel)"}
    - {id: S41, name: Workpiece orientation ok, actions: [{do: Eject workpiece, stored: false}]}
    - id: S42
      name: Workpiece orientation not ok
      actions:
        - {do: Turn on the "start" indicator light, stored: false}
        - {do: Turn on the "workpiece orientation not ok" indicator light, stored: false}
    - id: S14
      name: Cycle end
      actions:
        - {do: Set flag "cycle end", stored: false}
        - {do: Shift the "workpiece orientation" bits by one position, stored: false}
  transitions:
    - {from: S1, to: S6, condition: Station is reset and in initial position}
    - {from: S1, to: S2, condition: Station is not reset}
    - {from: S2, to: S3, condition: Reset button pressed}
    - {from: S3, to: S4, condition: Drill in upward position}
    - {from: S4, to: S5, condition: Station in initial position}
    - {from: S5, to: S6, condition: Flag "reset finished" is set}
    - {from: S6, to: S7, condition: Flag "start" is not set}
    - {from: S6, to: S8, condition: Flag "start" is set}
    - {from: S7, to: S8, condition: Flag "start" is set}
    - {from: S8, to: S9, condition: Workpiece available}
    - {from: S9, to: S10, condition: 3 s in step 9}
    - {from: S10, to: S11, condition: Downstream station free}
    - {from: S11, to: S12, condition: Rotary indexing table not positioned}
    - {from: S12, to: S13, condition: Rotary indexing table positioned}
    - {from: S13, to: "M20, M30, M40", condition: 1 s in step 13 (parallel start)}
    - {from: M20, to: S21, condition: Workpiece available}
    - {from: S21, to: S22, condition: 3 s in step 21 and workpiece orientation ok}
    - {from: S21, to: S23, condition: 3 s in step 21 and workpiece orientation not ok}
    - {from: "S22, S23", to: end of M20, condition: Verifying magnet is off}
    - {from: M30, to: S31, condition: Workpiece available and bit 2 of "workpiece orientation" not set}
    - {from: S31, to: S32, condition: Workpiece is fixed}
    - {from: S32, to: S33, condition: Drilling unit lowered}
    - {from: S33, to: S34, condition: Drilling unit raised}
    - {from: S34, to: end of M30, condition: Workpiece is unfixed}
    - {from: M40, to: S41, condition: Bit 3 of "workpiece orientation" not set}
    - {from: M40, to: S42, condition: Bit 3 of "workpiece orientation" set}
    - {from: S41, to: end of M40, condition: 1 s in step 41}
    - {from: S42, to: end of M40, condition: Error acknowledged}
    - {from: "M20, M30, M40", to: S14, condition: "Macro steps M20, M30 and M40 completed"}
    - {from: S14, to: S6, condition: Flag "cycle end" is set}
