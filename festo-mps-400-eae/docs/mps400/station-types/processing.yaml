station_type:
  id: processing
  name: Processing station
  name_de: Station Bearbeiten
  doc_series: MPS-C
  status: documented
  sources: [cd-03-el, cd-03-grafcet, cd-03-parts]
  function: >-
    A rotary indexing table carries workpieces past a checking unit (is the workpiece the right
    way up?) and a drilling unit (clamp, lower, drill, raise). Festo's version ejects finished
    workpieces with an electrical ejector. All actuators are electric; the station has no
    pneumatics.
  function_status: inferred

io_terminal:
  id: XA2
  part: "034035 I/O terminal (MP-B-AN-E/A-T)"
  syslink_station: XMA2
  syslink_console: XMG1
  inputs: 8
  outputs: 8
  supply:
    inputs: {plus: "24VB on XMA2 pins 21-22", minus: "0VB on XMA2 pins 23-24"}
    outputs: {plus: "24VA on XMA2 pins 9-10", minus: "0VA on XMA2 pins 11-12"}
  relays: ["K1", "K2", "K3", "K4", "K5"]
  status: documented
  sources: ["cd-03-el#3-7", cd-03-parts]

devices:
  - id: TABLE
    kind: rotary indexing table, electric
    name: Rotary indexing table
    name_de: Rundschalttisch
    motor: M2 (24 V, 5 W)
    relays: ["K2", "K5"]
    sensors: ["B3"]
    part: {ref: "654972 Rotary indexing table (MP3-M-RST)", status: inferred}
    status: documented
    sources: ["cd-03-el#5-6"]
    note: >-
      Output O1 is a start pulse, not a run command: it pulls in relay K2, which holds itself
      and runs motor M2. When sensor B3 reports the next position, relay K5 drops K2 and the
      motor stops (with a braking resistor R1). The PLC therefore switches O1 on, and off again
      once the table has left its position.
  - id: DRILL
    kind: drilling unit, electric
    name: Drilling unit
    name_de: Bohrmaschine
    motors: {drill: "M3 (24 V, 25 W) via relay K1", feed: "M1 (24 V, 5 W), reversed by relays K3 (raise) and K4 (lower)"}
    sensors: ["1B1", "1B2"]
    part: {ref: "196974 Drilling module (MP3-M-B-BS)", status: inferred}
    status: documented
    sources: ["cd-03-el#4-7"]
    note: >-
      The limit switches 1B1 (upper) and 1B2 (lower) sit in the coil circuits of K3 and K4, so
      the feed stops at the end positions in hardware. They are also wired to inputs I3 and I4.
  - id: M4
    kind: solenoid
    name: Clamping (fixing workpiece)
    name_de: Werkstück spannen
    sensors: []
    part: {ref: "526218 Clamping module (MP3-M-S-BS)", status: inferred}
    status: documented
    sources: ["cd-03-el#5"]
  - id: M5
    kind: solenoid
    name: Checking unit, verifying magnet (probe)
    name_de: Werkstück prüfen
    sensors: ["B4"]
    part: {ref: "195773 Testing module (MP3-M-BP-B-BS)", status: inferred}
    status: documented
    sources: ["cd-03-el#4-5", "cd-03-grafcet#5"]
    note: >-
      The probe goes down onto the workpiece; B4 reports "checking drill hole ok", which Festo's
      sequence reads as "workpiece orientation ok" (opening facing up).
  - id: M6
    kind: solenoid
    name: Ejector (push out workpiece)
    name_de: Werkstück auswerfen
    sensors: []
    part: {ref: "526873 Branch module (MP3-M-AW-BS)", status: inferred}
    status: documented
    sources: ["cd-03-el#5"]
    note: Fed through resistor R3 (56 ohm).
  - {id: "PART_AV", kind: capacitive sensor, name: Workpiece available (input position), name_de: Werkstück vorhanden, status: documented, sources: ["cd-03-el#4"]}
  - {id: "B1", kind: capacitive sensor, name: Workpiece at checking unit, name_de: Werkstück bei Prüfvorrichtung, status: documented, sources: ["cd-03-el#4"]}
  - {id: "B2", kind: capacitive sensor, name: Workpiece at drilling unit, name_de: Werkstück bei Bohrvorrichtung, status: documented, sources: ["cd-03-el#4"]}
  - {id: "B3", kind: inductive sensor, name: Indexing table positioned, name_de: Rundschalttisch positioniert, status: documented, sources: ["cd-03-el#4", "cd-03-el#6"]}
  - {id: "B4", kind: inductive sensor, name: Checking drill hole ok, name_de: Bohrlochprüfung in Ordnung, status: documented, sources: ["cd-03-el#4"]}
  - {id: "IP_FI", kind: optical receiver, name: "Downstream station free, receiver of the 1-bit link", name_de: Folgestation frei, status: documented, sources: ["cd-03-el#4"]}
  - {id: "IP_N_FO", kind: optical transmitter, name: "Station occupied, transmitter of the 1-bit link", name_de: Station belegt, status: documented, sources: ["cd-03-el#5"]}

signals:
  status: documented
  sources: ["cd-03-el#4-5", nxt]
  note: >-
    legacy = the signal name in the NxtStudio solution, which binds the same bit numbers
    (DIN0-DIN6, DO0-DO5).
  verify: >-
    The legacy names of I1 and I2 are swapped against the drawing: legacy I1 = WP_DRILL and
    I2 = WP_TEST, drawing I1 = at checking unit and I2 = at drilling unit. Either the lab
    station is wired differently or the legacy names are wrong. Check on the hardware
    (open question q-proc-sensors in plant.yaml).
  inputs:
    - {address: I0, pin: 13, symbol: "PART_AV", device: "PART_AV", meaning: Workpiece available, meaning_de: Werkstück vorhanden, legacy: WP_AVAIL}
    - {address: I1, pin: 14, symbol: "B1", device: "B1", meaning: Workpiece at checking unit, meaning_de: Werkstück bei Prüfvorrichtung, legacy: WP_DRILL}
    - {address: I2, pin: 15, symbol: "B2", device: "B2", meaning: Workpiece at drilling unit, meaning_de: Werkstück bei Bohrvorrichtung, legacy: WP_TEST}
    - {address: I3, pin: 16, symbol: "1B1", device: DRILL, meaning: Drilling unit in upper position, meaning_de: Bohrmaschine oben, legacy: DRILL_RAISED}
    - {address: I4, pin: 17, symbol: "1B2", device: DRILL, meaning: Drilling unit in lower position, meaning_de: Bohrmaschine unten, legacy: DRILL_LOWERED}
    - {address: I5, pin: 18, symbol: "B3", device: "B3", meaning: Indexing table positioned, meaning_de: Rundschalttisch positioniert, legacy: IN_POSITION}
    - {address: I6, pin: 19, symbol: "B4", device: "B4", meaning: Checking drill hole ok, meaning_de: Bohrlochprüfung in Ordnung, legacy: HOLE_DETECTED}
    - {address: I7, pin: 20, symbol: "IP_FI", device: "IP_FI", meaning: Downstream station free, meaning_de: Folgestation frei, legacy: null}
  outputs:
    - {address: O0, pin: 1, symbol: "K1", device: DRILL, meaning: Drilling unit motor on, meaning_de: Bohrmaschine Motor ein, legacy: START_DRILL}
    - {address: O1, pin: 2, symbol: "K2", device: TABLE, meaning: Indexing table motor on (start pulse), meaning_de: Rundschalttisch Motor ein, legacy: ROTATE}
    - {address: O2, pin: 3, symbol: "K4", device: DRILL, meaning: Lower drilling unit, meaning_de: Bohrmaschine nach unten, legacy: LOWER_DRILL}
    - {address: O3, pin: 4, symbol: "K3", device: DRILL, meaning: Raise drilling unit, meaning_de: Bohrmaschine nach oben, legacy: RAISE_DRILL}
    - {address: O4, pin: 5, symbol: "M4", device: M4, meaning: Fixing (clamping) workpiece, meaning_de: Werkstück spannen, legacy: CLAMP}
    - {address: O5, pin: 6, symbol: "M5", device: M5, meaning: Proofing (checking) workpiece, meaning_de: Werkstück prüfen, legacy: TEST}
    - {address: O6, pin: 7, symbol: "M6", device: M6, meaning: Push out workpiece, meaning_de: Werkstück auswerfen, legacy: null}
    - {address: O7, pin: 8, symbol: "IP_N_FO", device: "IP_N_FO", meaning: Station occupied, meaning_de: Station belegt, legacy: null}

